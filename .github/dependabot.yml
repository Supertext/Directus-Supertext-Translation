version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Versions we can't take yet or update by hand (see docs/DEVELOPER.md):
    ignore:
      - dependency-name: "typescript"  # TypeScript 7 is the native compiler; vue-tsc and the build tooling still need 5.x
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"  # types must match the oldest supported Node version, not the newest
        update-types: ["version-update:semver-major"]
      # vue must be exactly the version @directus/extensions-sdk pins (the one Directus bundles);
      # a second copy breaks vue-tsc. Update it by hand together with the SDK (see docs/DEVELOPER.md).
      - dependency-name: "vue"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
